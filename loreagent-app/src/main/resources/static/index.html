<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>LoreAgent 临时调试页</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 32px auto; padding: 0 16px; }
    textarea { width: 100%; height: 80px; box-sizing: border-box; padding: 8px; }
    .row { display: flex; gap: 8px; align-items: center; margin: 8px 0 16px; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f6f8fa; padding: 12px; min-height: 160px; border-radius: 6px; }
    #status { color: #555; font-size: 13px; margin-left: auto; }
  </style>
</head>
<body>
  <h2>LoreAgent 临时调试页（Phase 1a）</h2>
  <textarea id="msg" placeholder="输入问题，按 Ctrl+Enter 或点击发送..."></textarea>
  <div class="row">
    <button id="send">发送</button>
    <button id="stop" disabled>停止</button>
    <span id="status">空闲</span>
  </div>
  <pre id="out"></pre>

  <script>
    const msgEl = document.getElementById('msg');
    const outEl = document.getElementById('out');
    const sendBtn = document.getElementById('send');
    const stopBtn = document.getElementById('stop');
    const statusEl = document.getElementById('status');
    let controller = null;

    function setBusy(busy) {
      sendBtn.disabled = busy;
      stopBtn.disabled = !busy;
    }

    function handleSseBlock(block) {
      let eventName = 'message';
      const dataLines = [];
      for (const line of block.split('\n')) {
        if (!line || line.startsWith(':')) continue;
        if (line.startsWith('event:')) eventName = line.slice(6).trim();
        else if (line.startsWith('data:')) dataLines.push(line.slice(5).replace(/^ /, ''));
      }
      if (!dataLines.length) return;
      const payload = JSON.parse(dataLines.join('\n'));
      if (eventName === 'delta') {
        outEl.textContent += payload.text || '';
      } else if (eventName === 'done') {
        const total = payload.usage ? payload.usage.totalTokens : '-';
        statusEl.textContent = `完成 (${payload.finishReason || 'stop'}, tokens=${total})`;
      } else if (eventName === 'error') {
        statusEl.textContent = `错误 [${payload.code}]: ${payload.message}`;
      }
    }

    async function sendChat() {
      const text = msgEl.value.trim();
      if (!text) return;
      outEl.textContent = '';
      statusEl.textContent = '生成中...';
      controller = new AbortController();
      setBusy(true);

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, clientRequestId: crypto.randomUUID() }),
          signal: controller.signal
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ code: res.status, message: res.statusText }));
          statusEl.textContent = `请求失败 [${err.code}]: ${err.message}`;
          return;
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true }).replace(/\r\n/g, '\n');
          const parts = buffer.split('\n\n');
          buffer = parts.pop();
          parts.forEach(handleSseBlock);
        }
        if (buffer.trim()) handleSseBlock(buffer);
      } catch (e) {
        statusEl.textContent = e.name === 'AbortError' ? '已停止' : `网络异常: ${e.message}`;
      } finally {
        controller = null;
        setBusy(false);
      }
    }

    sendBtn.onclick = sendChat;
    stopBtn.onclick = () => controller && controller.abort();
    msgEl.onkeydown = (e) => { if (e.ctrlKey && e.key === 'Enter') sendChat(); };
  </script>
</body>
</html>
