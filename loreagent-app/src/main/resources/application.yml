spring:
  application:
    name: loreagent
  # 本地密钥放 application-local.yml（已 gitignore），存在时自动加载，缺失也不报错。
  # 同时兼容“从项目根目录运行”和“从模块目录运行”两种工作目录。
  config:
    import:
      - optional:file:./application-local.yml
      - optional:file:../application-local.yml
  datasource:
    url: ${LORE_DB_URL:jdbc:postgresql://localhost:5432/loreagent}
    username: ${LORE_DB_USER:postgres}
    password: ${LORE_DB_PASSWORD:}
  sql:
    init:
      # 不引入 Flyway，启动时幂等执行 schema.sql 建表
      mode: ${LORE_SQL_INIT_MODE:always}

server:
  port: 8080
  # 开启优雅停机，避免正在输出的流式响应或落库事务被强行截断
  shutdown: graceful

lore:
  model:
    base-url: ${LORE_MODEL_BASE_URL:https://magpie.rayagent.cloud/v1}
    # 密钥绝不入库：本地通过环境变量或 application-local.yml 提供
    api-key: ${LORE_MODEL_API_KEY:}
    name: ${LORE_MODEL_NAME:auto/deepseek-v4.1-flash}
