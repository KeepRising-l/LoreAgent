services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: loreagent-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: loreagent
      POSTGRES_USER: ${LORE_DB_USER:-loreagent}
      POSTGRES_PASSWORD: ${LORE_DB_PASSWORD:-loreagent}
    volumes:
      - loreagent_pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: loreagent-rabbitmq
    profiles:
      - mq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  loreagent_pgdata:
